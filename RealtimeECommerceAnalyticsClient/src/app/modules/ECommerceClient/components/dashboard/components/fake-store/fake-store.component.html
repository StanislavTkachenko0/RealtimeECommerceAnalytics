<div class="analytics-container">
  <div>
    <h2>{{ 'FakeStoreStats' | translate }}</h2>
    <div style="display: block;">
      <canvas baseChart
              [data]="barChartData"
              [labels]="barChartLabels"
              [options]="barChartOptions"
              [legend]="true"
              [type]="'bar'">
      </canvas>
    </div>
  </div>
</div>
